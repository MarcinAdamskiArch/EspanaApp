<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conjugo · hiszpańskie czasowniki</title>
<meta name="theme-color" content="#8E0945">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Conjugo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly language-school app, bold and clear, never childish
   IDEA: a deck of Spanish verb cards from the textbook's colour-coded tables
   PICTURE: the card itself — big infinitive, flip to the 6-person table
   COLOUR and TYPE: burgundy #8E0945 field, pink/periwinkle/orange accents, white cards; Nunito rounded
   LAYOUT: app shell — top bar, one task in the middle, thumb-reach buttons, tab bar */
:root{color-scheme:light;
 --pri:#8E0945;--pri-d:#6d0634;--pri-t:#8E0945;--acc:#E16733;--pink:#DC8EB6;--blue:#98AFF5;
 --bg:#fcf5f8;--card:#ffffff;--ink:#2b0f1d;--mute:#84606f;--line:#f1dde7;--soft:#f9e7f0;
 --ok:#5a78e0;--okbg:#e9eeff;--warn:#E16733;--warnbg:#fdebe0;--bad:#8E0945;--badbg:#fbe3ee;
 --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#1c0b14;--card:#2b1420;--ink:#fbeef4;--mute:#c6a3b4;--line:#46202f;--soft:#3a1a2a;--pri:#a3104f;--pri-t:#DC8EB6;--okbg:#1e2748;--warnbg:#3d2216;--bad:#DC8EB6;--badbg:#3f1427}}
:root[data-theme=dark]{color-scheme:dark;--bg:#1c0b14;--card:#2b1420;--ink:#fbeef4;--mute:#c6a3b4;--line:#46202f;--soft:#3a1a2a;--pri:#a3104f;--pri-t:#DC8EB6;--okbg:#1e2748;--warnbg:#3d2216;--bad:#DC8EB6;--badbg:#3f1427}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 Nunito,ui-rounded,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{background:var(--pri);color:#fff;padding:calc(var(--safe-t) + 12px) 18px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.01em;flex:1}
header h1 span{color:var(--pink)}
.filter{background:rgba(255,255,255,.16);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:800;color:#fff;min-height:36px;display:flex;align-items:center;gap:6px}
main{flex:1;padding:16px 16px calc(96px + var(--safe-b))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:center}
nav.tabs div{width:100%;max-width:560px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:800;color:var(--mute);min-height:52px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current=page]{color:var(--pri-t)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{border-radius:10px;padding:9px 6px;font-weight:800;font-size:15px;color:var(--mute);min-height:40px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,#999);display:inline-block}
.panel{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(120,30,20,.35)}
.muted{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.say{width:44px;height:44px;border-radius:50%;background:var(--soft);display:inline-grid;place-items:center;color:var(--pri-t);flex:none}
.say.sm{width:36px;height:36px}.say.sm svg{width:18px;height:18px}
.say svg{width:22px;height:22px}
.say:active{transform:scale(.94)}
.btn{border-radius:16px;padding:14px 18px;font-weight:900;font-size:17px;min-height:54px;width:100%}
.btn.primary{background:var(--pri);color:#fff}
.btn.primary:active{background:var(--pri-d)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
/* flashcard */
.deckinfo{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:13.5px;font-weight:800;color:var(--mute);margin:0 0 10px}
.deckinfo span{background:var(--soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.deckinfo b{color:var(--ink)}
.qbtn{width:28px;height:28px;border-radius:50%;background:var(--soft);font-weight:900;color:var(--pri-t);font-size:15px}
.lvl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--mute)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 70px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:15px;transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .boxes b{background:rgba(127,127,127,.45)}.toast .boxes b.f{background:var(--acc)}
.info p{margin:8px 0}.info ul{margin:8px 0;padding-left:20px}.info li{margin:4px 0}
.flip{perspective:1400px}
.card{position:relative;height:480px;height:clamp(440px,calc(100dvh - 310px),560px);transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.card.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--card);padding:20px;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line),0 18px 40px -22px rgba(110,6,52,.45);border-top:10px solid var(--pink);cursor:pointer}
.card.on .face.front,.card:not(.on) .face.back{pointer-events:none}
.face.back{transform:rotateY(180deg);overflow:auto;border-top-color:var(--c)}
.big{font-size:clamp(40px,12vw,56px);font-weight:900;line-height:1.05;letter-spacing:-.02em;text-align:center;overflow-wrap:anywhere}
.mid{flex:1;display:grid;place-items:center;align-content:center;gap:10px;text-align:center}
.tapnote{text-align:center;font-size:14px;color:var(--mute);font-weight:700}
.tr{font-size:22px;font-weight:800;text-align:center}
.note{font-size:14px;background:var(--warnbg);border-radius:10px;padding:6px 10px;margin:8px auto 0;width:fit-content;font-weight:700}
table.conj{width:100%;border-collapse:collapse;margin-top:12px;font-size:17px}
table.conj td{padding:2px 4px;border-top:1px solid var(--line);height:38px}
table.conj{margin-top:8px}
table.conj td:first-child{color:var(--mute);font-size:14px;font-weight:700;width:46%}
table.conj td:nth-child(2){font-weight:800;text-align:right}
table.conj td:nth-child(3){width:44px;text-align:right}
.end{color:var(--acc)}
mark{background:none;color:var(--pri-t);text-decoration:underline 3px var(--pink);text-underline-offset:3px}
.legend{font-size:12.5px;color:var(--mute);margin-top:8px;text-align:center}
.boxes{display:flex;gap:4px;justify-content:center}
.boxes b{width:18px;height:6px;border-radius:3px;background:var(--line)}
.boxes b.f{background:var(--acc)}
/* drill */
.prompt{text-align:center}
.prompt .inf{font-size:clamp(34px,10vw,44px);font-weight:900;line-height:1.1}
.person{display:inline-block;margin-top:12px;background:var(--blue);color:#14245e;font-weight:900;font-size:20px;padding:6px 16px;border-radius:12px}
.ans{width:100%;font-size:22px;font-weight:800;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);margin-top:16px;text-align:center;outline:none}
.ans:focus{border-color:var(--pri-t)}
.ans.ok{border-color:var(--ok);background:var(--okbg)}.ans.bad{border-color:var(--bad);background:var(--badbg)}.ans.warn{border-color:var(--warn);background:var(--warnbg)}
.accents{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.accents button{width:44px;height:44px;border-radius:12px;background:var(--soft);font-weight:900;font-size:19px}
.fb{margin-top:14px;border-radius:16px;padding:12px 14px;font-weight:700;display:flex;align-items:center;gap:10px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.warn{background:var(--warnbg)}
.fb strong{font-size:20px;font-weight:900}
.fb .sym{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none;background:var(--ok)}.fb.bad .sym{background:var(--bad)}.fb.warn .sym{background:var(--warn)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{border-radius:16px;padding:14px;font-weight:800;font-size:19px;background:var(--soft);min-height:56px;text-align:center;border:2px solid transparent}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opts.sent .opt{font-size:17px;text-align:left;font-weight:700}
.tbl{display:grid;gap:6px;margin-top:14px}
.tbl label{display:grid;grid-template-columns:42% 1fr;align-items:center;gap:8px;font-weight:700;color:var(--mute);font-size:15px}
.tbl input{font-size:18px;font-weight:800;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);outline:none;width:100%}
.tbl input:focus{border-color:var(--pri-t)}
.tbl input.ok{border-color:var(--ok);background:var(--okbg)}.tbl input.bad{border-color:var(--bad);background:var(--badbg)}.tbl input.warn{border-color:var(--warn);background:var(--warnbg)}
.tbl small{grid-column:2;color:var(--bad);font-weight:800;margin-top:-4px}
.score{display:flex;gap:8px;justify-content:center;margin-bottom:12px;font-size:14px;font-weight:800;color:var(--mute)}
.score span{background:var(--soft);padding:4px 10px;border-radius:999px}
/* phrases */
.pl{font-size:21px;font-weight:800;text-align:center;line-height:1.3}
.es{font-size:22px;font-weight:800;text-align:center;line-height:1.35;margin-top:14px}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--pri-t);color:var(--pri-t)}
.hint{text-align:center;margin-top:8px;font-size:15px;font-weight:700;color:var(--mute)}
/* settings */
h2{font-size:20px;font-weight:900;margin:22px 4px 10px}
h2:first-child{margin-top:4px}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set>div{flex:1}.set b{display:block;font-weight:800}.set small{color:var(--mute);font-size:14px}
.sw{appearance:none;width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw:checked{background:var(--pri)}.sw:checked::after{transform:translateX(20px)}
select,input[type=range]{width:100%}
select{padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:16px}
.groups{display:flex;flex-wrap:wrap;gap:8px}
.groups button{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;font-weight:800;font-size:14px;background:var(--soft);border:2px solid transparent;min-height:40px;color:var(--mute)}
.groups button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.groups button[aria-pressed=true]{background:var(--card);border-color:var(--c);color:var(--ink)}
.prog{display:grid;gap:8px}
.prog div{display:grid;grid-template-columns:1fr 90px 44px;align-items:center;gap:10px;font-size:14px;font-weight:700}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.prog em{font-style:normal;text-align:right;color:var(--mute)}
ol.howto{margin:0;padding-left:22px}ol.howto li{margin:4px 0}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(20,8,6,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-height:85vh;overflow:auto}
.empty{text-align:center;padding:40px 10px;color:var(--mute);font-weight:700}
header .hbtn{width:40px;height:40px;margin:-6px 0 -6px -8px;border-radius:12px;color:#fff;display:grid;place-items:center}
header .hbtn svg{width:24px;height:24px}
body.notabs main{padding-bottom:calc(30px + var(--safe-b))}
nav.tabs div{display:grid}
nav.tabs button{font-size:11.5px}
.hello{padding:10px 6px 18px}.hello .hi{font-size:46px;font-weight:900;line-height:1;color:var(--pri-t);letter-spacing:-.02em}.hello .muted{font-size:19px;font-weight:700;margin-top:6px}
.tiles{display:grid;gap:14px}
.tile{display:grid;grid-template-columns:1fr 110px;grid-template-areas:"b art" "s art" "bar bar" "em em";text-align:left;background:var(--card);border-radius:24px;padding:18px 18px 16px;box-shadow:0 1px 0 var(--line),0 14px 34px -22px rgba(110,6,52,.5);border-left:8px solid var(--c);gap:4px 10px;align-items:start}
.tile b{grid-area:b;font-size:28px;font-weight:900;line-height:1.1}
.tile small{grid-area:s;color:var(--mute);font-weight:700;font-size:14.5px}
.tile .art{grid-area:art;width:110px;height:84px}
.tile .tbar{grid-area:bar;height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px}.tile .tbar i{display:block;height:100%;background:var(--acc)}
.tile em{grid-area:em;font-style:normal;font-size:13px;font-weight:800;color:var(--mute)}
.tile:active{transform:scale(.99)}
.homefoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.pill{background:var(--soft);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:800;color:var(--mute)}.pill b{color:var(--ink)}
.linkbtn{color:var(--pri-t);min-height:40px}
.pickhead{margin:4px 4px 6px}.pickhead b{font-size:20px;font-weight:900;display:block}
.grp{background:var(--card);border-radius:20px;padding:6px 6px 8px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.grphead{display:flex;align-items:center;gap:10px;padding:10px 10px 6px}.grphead b{flex:1;font-size:15px;font-weight:900}
.mini-btn{font-size:13px;font-weight:800;color:var(--pri-t);padding:6px 10px;border-radius:999px;background:var(--soft);min-height:32px}
.topic{display:grid;grid-template-columns:30px 1fr 54px;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:14px;min-height:54px}
.topic+.topic{border-top:1px solid var(--line)}
.topic .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.topic[aria-pressed=true] .ck{background:var(--pri);border-color:var(--pri)}
.topic[aria-pressed=true] .ck::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.topic .tt b{display:block;font-weight:800;font-size:16px;line-height:1.25}.topic .tt small{color:var(--mute);font-size:13px;font-weight:700}
.topic .mini{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.topic .mini i{display:block;height:100%;background:var(--acc)}
.stick{position:sticky;bottom:calc(78px + var(--safe-b));padding-top:8px;z-index:3}
.btn:disabled{background:var(--line);color:var(--mute)}
.search{width:100%;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);margin-bottom:6px;outline:none}
.search:focus{border-color:var(--pri-t)}
.vlist{padding:4px 14px}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.vrow:first-child{border-top:0}
.vrow>div{flex:1}.vrow b{display:block;font-weight:800}.vrow span{color:var(--mute);font-size:14.5px;font-weight:600}
.vrow .boxes{flex:none}
@media (prefers-reduced-motion:reduce){.card,.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
<header><button class="hbtn" id="homeBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1 id="title">Conjug<span>o</span></h1><button class="filter" id="filterBtn"></button></header>
<main id="view"></main>
</div>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script>

}

const sheet=document.getElementById('sheet');
let sheetMode='groups';
function openInfo(){sheetMode='info';document.getElementById('sheetBody').innerHTML=`<h2 style="margin-top:0">${t('lvInfo')}</h2><div class="info">${INFO[S.lang]}</div><button class="btn primary" id="closeSheet" style="margin-top:12px">${t('done')}</button>`;sheet.classList.add('open')}
function openSheet(){sheetMode='groups';document.getElementById('sheetBody').innerHTML=`<h2 style="margin-top:0">${t('groups')}</h2>${groupsHtml()}<button class="btn primary" id="closeSheet" style="margin-top:16px">${t('done')}</button>`;sheet.classList.add('open')}
document.getElementById('filterBtn').addEventListener('click',()=>{if(S.mod==='verbs')openSheet();else if(S.mod==='vocab'){if(S.wtab!=='topics')S.wprev=S.wtab;S.wtab='topics';save();render(true)}});
document.getElementById('homeBtn').addEventListener('click',()=>{S.mod='home';save();render(true)});
sheet.addEventListener('click',e=>{
 const g=e.target.closest('[data-g]');if(g){toggleGroup(g.dataset.g);g.setAttribute('aria-pressed',S.groups.includes(g.dataset.g));renderHeader();return}
 if(e.target===sheet||e.target.id==='closeSheet'){sheet.classList.remove('open');if(sheetMode==='groups')render(true)}
});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;if(S.mod==='verbs')S.tab=b.dataset.tab;else S.wtab=b.dataset.tab;save();render(true)});
view.addEventListener('click',e=>{
 const s=e.target.closest('[data-say]');if(s){say(s.dataset.say);return}
 const acc=e.target.closest('[data-acc]');if(acc){e.preventDefault();insertAcc(acc.dataset.acc);return}
 const m=e.target.closest('[data-mod]');if(m){S.mod=m.dataset.mod;if(S.mod==='vocab'&&!S.vt.length)S.wtab='topics';save();return render(true)}
 const tab=curTab();
 if(tab==='cards')return cardsClick(e);
 if(tab==='drill'){
  const md=e.target.closest('[data-mode]');if(md){S.dMode=md.dataset.mode;save();return nextDrill()}
  const o=e.target.closest('[data-opt]');if(o)return chooseOpt(o);
  if(e.target.id==='go')return S.dMode==='choose'?nextDrill():checkDrill();
 }
 if(tab==='phr'){
  const md=e.target.closest('[data-pmode]');if(md){S.pMode=md.dataset.pmode;save();return nextPhrase()}
  const o=e.target.closest('[data-sent]');if(o)return chooseSent(o);
  if(e.target.id==='go')return S.pMode==='sent'?nextPhrase():checkPhrase();
 }
 if(S.mod==='vocab'&&(S.wtab==='topics'||!S.vt.length)){
  const tp=e.target.closest('[data-topic]');if(tp){const id=tp.dataset.topic;const i=S.vt.indexOf(id);if(i>=0)S.vt.splice(i,1);else S.vt.push(id);save();const y=window.scrollY;renderTopics();renderHeader();window.scrollTo(0,y);return}
  const ga=e.target.closest('[data-gall]');if(ga){const ids=ga.dataset.gall.split(',');const on=ga.dataset.on==='1';S.vt=S.vt.filter(x=>!ids.includes(x));if(on)S.vt.push(...ids);save();const y=window.scrollY;renderTopics();renderHeader();window.scrollTo(0,y);return}
  if(e.target.id==='startV'){S.wtab=S.wprev&&S.wprev!=='topics'?S.wprev:'vcards';save();return render(true)}
  return;
 }
 if(tab==='vcards')return vcardsClick(e);
 if(tab==='vquiz'){
  const d=e.target.closest('[data-dir]');if(d){S.dir=d.dataset.dir;save();return nextVQuiz()}
  const o=e.target.closest('[data-vopt]');if(o)return chooseVOpt(o);
  if(e.target.id==='go')return nextVQuiz();
 }
 if(tab==='vtype'&&e.target.id==='go')return checkVType();
 if(tab==='more'){
  const l=e.target.closest('[data-lang]');if(l){S.lang=l.dataset.lang;save();return render(true)}
  const g=e.target.closest('[data-g]');if(g){toggleGroup(g.dataset.g);return render(true)}
  if(e.target.id==='reset'){if(!resetArm){resetArm=true;e.target.textContent=t('resetQ');return}
   S.box={};S.vbox={};S.sk={};S.n=S.ok=S.streak=S.best=0;S.day=null;save();resetArm=false;return render(true)}
 }
});
view.addEventListener('input',e=>{if(e.target.id==='vsearch'){st.q=e.target.value;renderVList()}});
view.addEventListener('mousedown',e=>{if(e.target.closest('[data-acc]'))e.preventDefault()});
view.addEventListener('pointerdown',e=>{if(e.target.closest('[data-acc]'))e.preventDefault()});
view.addEventListener('change',e=>{
 const id=e.target.id;
 if(['vos','strict','auto'].includes(id)){S[id]=e.target.checked;save();if(id==='vos')st={}}
 if(id==='voice'){S.voice=e.target.value;save();say('Hola')}
 if(id==='rate'){S.rate=+e.target.value;save();say('Abro la ventana')}
});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.ans,.tbl input')){e.preventDefault();
 if(e.target.matches('.tbl input')){const n=e.target.closest('label').nextElementSibling;if(n&&n.querySelector('input')&&!st.done)return n.querySelector('input').focus()}
 document.getElementById('go')?.click()}});
S.mod='home';
render(true);
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
</script>
</body>
</html>
